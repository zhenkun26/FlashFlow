spring:
  application:
    name: flashflow
  datasource:
    url: ${FLASHFLOW_DB_URL:jdbc:mysql://127.0.0.1:3306/flashflow?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${FLASHFLOW_DB_USER:flashflow}
    password: ${FLASHFLOW_DB_PASSWORD:flashflow}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
  data:
    redis:
      url: ${FLASHFLOW_REDIS_URL:redis://127.0.0.1:6379}
      connect-timeout: ${FLASHFLOW_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${FLASHFLOW_REDIS_COMMAND_TIMEOUT:1s}
  jackson:
    time-zone: UTC

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

flashflow:
  inventory:
    strategy: CONDITIONAL_ATOMIC
    optimistic-max-retries: 3
  ordering:
    transaction-max-retries: 5
    claim-race-max-retries: 1
    transaction-sequence: ${FLASHFLOW_ORDERING_TRANSACTION_SEQUENCE:STOCK_FIRST}
  expiration:
    order-ttl: PT10M
    batch-size: 100
    scheduling-enabled: true
  admission:
    mode: ${FLASHFLOW_ADMISSION_MODE:MYSQL_ONLY}
    held-resolution: ${FLASHFLOW_ADMISSION_HELD_RESOLUTION:PT30S}
    script-version: ${FLASHFLOW_ADMISSION_SCRIPT_VERSION:v2-1}
    identity-secret: ${FLASHFLOW_ADMISSION_IDENTITY_SECRET:}
  messaging:
    mode: ${FLASHFLOW_MESSAGING_MODE:DISABLED}
    namesrv-addr: ${FLASHFLOW_ROCKETMQ_NAMESRV_ADDR:127.0.0.1:9876}
    client-version: "5.3.3"
    broker-version: "5.3.4"
    producer-group: ${FLASHFLOW_ROCKETMQ_PRODUCER_GROUP:flashflow-v3-producer}
    order-topic: ${FLASHFLOW_ROCKETMQ_ORDER_TOPIC:flashflow-order-command-v1}
    order-consumer-group: ${FLASHFLOW_ROCKETMQ_ORDER_GROUP:flashflow-order-consumer-v1}
    expiration-topic: ${FLASHFLOW_ROCKETMQ_EXPIRATION_TOPIC:flashflow-expiration-v1}
    expiration-consumer-group: ${FLASHFLOW_ROCKETMQ_EXPIRATION_GROUP:flashflow-expiration-consumer-v1}
    dead-letter-topic: ${FLASHFLOW_ROCKETMQ_DEAD_LETTER_TOPIC:flashflow-order-dead-letter-v1}
    send-timeout: ${FLASHFLOW_ROCKETMQ_SEND_TIMEOUT:3s}
    producer-retries: ${FLASHFLOW_ROCKETMQ_PRODUCER_RETRIES:1}
    max-reconsume-times: ${FLASHFLOW_ROCKETMQ_MAX_RECONSUME_TIMES:3}
    delay-level: ${FLASHFLOW_ROCKETMQ_DELAY_LEVEL:14}
    drain-timeout: ${FLASHFLOW_ROCKETMQ_DRAIN_TIMEOUT:30s}
    consume-from: ${FLASHFLOW_ROCKETMQ_CONSUME_FROM:FIRST}
    acknowledgement: SYNC_FLUSH
    injected-fault: ${FLASHFLOW_MESSAGING_INJECTED_FAULT:NONE}

management:
  health:
    redis:
      enabled: ${FLASHFLOW_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} request_id=%X{requestId:-} idempotency_key=%X{idempotencyKey:-} order_id=%X{orderId:-} user_id=%X{userId:-} sku_id=%X{activitySkuId:-} payment_tx=%X{providerTransactionId:-} - %msg%n"
