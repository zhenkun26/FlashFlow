services:
  rocketmq-namesrv:
    profiles: ["messaging-spike", "messaging-live"]
    image: apache/rocketmq:5.3.4
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports:
      - "${FLASHFLOW_ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    tmpfs:
      - /home/rocketmq/logs

  rocketmq-store-init:
    profiles: ["messaging-spike", "messaging-live"]
    image: apache/rocketmq:5.3.4
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq-store:/home/rocketmq/store

  rocketmq-broker:
    profiles: ["messaging-spike", "messaging-live"]
    image: apache/rocketmq:5.3.4
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      rocketmq-store-init:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - >-
        mkdir -p /home/rocketmq/logs/rocketmqlogs /home/rocketmq/store &&
        exec sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf --enable-proxy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "${FLASHFLOW_ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${FLASHFLOW_ROCKETMQ_FAST_PORT:-10909}:10909"
      - "${FLASHFLOW_ROCKETMQ_PROXY_GRPC_PORT:-8081}:8081"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    tmpfs:
      - /home/rocketmq/logs:uid=3000,gid=3000,mode=0775

  rocketmq-topics:
    profiles: ["messaging-live"]
    image: apache/rocketmq:5.3.4
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    network_mode: "service:rocketmq-broker"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q FlashFlowSpike; do sleep 2; done;
        for topic in flashflow-order-command-v1 flashflow-expiration-v1 flashflow-order-dead-letter-v1; do
          sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c FlashFlowSpike -t $$topic || exit 1;
        done

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${FLASHFLOW_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: flashflow
      MYSQL_USER: flashflow
      MYSQL_PASSWORD: flashflow
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=REPEATABLE-READ
    ports:
      - "${FLASHFLOW_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uflashflow", "-pflashflow"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - ${FLASHFLOW_MYSQL_DATA_DIR:-./docker/mysql-data}:/var/lib/mysql

volumes:
  rocketmq-store:
