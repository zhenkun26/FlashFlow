services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${FLASHFLOW_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: flashflow
      MYSQL_USER: flashflow
      MYSQL_PASSWORD: flashflow
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=REPEATABLE-READ
    ports:
      - "${FLASHFLOW_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uflashflow", "-pflashflow"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - ${FLASHFLOW_MYSQL_DATA_DIR:-./docker/mysql-data}:/var/lib/mysql
